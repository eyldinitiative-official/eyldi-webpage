      .drift-a { animation: driftA 16s ease-in-out infinite alternate; }
      .drift-b { animation: driftB 21s ease-in-out infinite alternate; }
      .bob { animation: bob 5.5s ease-in-out infinite alternate; }
      .bob2 { animation-duration: 6.8s; animation-delay: -2.4s; }
      .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.6s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(12px, -9px); } }
      @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-10px, 8px); } }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-9px); } }
      @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    }
  </style>
  <linearGradient id="gfade" x1="0" x2="1" y1="0" y2="0">
