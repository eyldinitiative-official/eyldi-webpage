    <stop offset="0.18" stop-color="#3a3340" stop-opacity="0.55"/>
    <stop offset="0.82" stop-color="#3a3340" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#3a3340" stop-opacity="0"/>
  </linearGradient>
